				if (colorIndex === -1) {

					colorIndex = colors.length - 1;
				}

				if (colorIndex === 0) { tempBinary = "00" + tempBinary; }
				if (colorIndex === 1) { tempBinary = "01" + tempBinary; }
				if (colorIndex === 2) { tempBinary = "10" + tempBinary; }

		function decodeImage() {

			const colorsEncoded = encodedResult.colorsEncoded;
			const pixelsEncoded = encodedResult.pixelsEncoded;

			const colorsHex = encodedResult.colorsEncoded.toString(16).padStart('24', '0');

			const pixelsBinary =
			    encodedResult.pixelsEncoded[1].toString(2).padStart(256, '0') +
				encodedResult.pixelsEncoded[0].toString(2).padStart(256, '0');

			const colorsDecoded = [
                colorsHex.slice(18, 24),
                colorsHex.slice(12, 18),

			    colorsHex.slice(0, 6),
			];

			    const firstBit = parseInt(pixelsBinary[pxBinaryStartPos], 2);
				const secondBit = parseInt(pixelsBinary[pxBinaryStartPos - 1], 2);

				const colorIndex = firstBit + (secondBit * 2);

				const rectFill = colorsDecoded[colorIndex];
				const rectX = i % 16;
				const rectY = Math.floor(i / 16);
